<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <h1>Login</h1>
        <p>Digite os seus dados de acesso nos campos abaixo:</p>
        <form id="form-login">
            <p>Usuário</p>
            <input type="text" name="usuario" placeholder="Digite seu nome de usuário" required id="usuario">
            <p>Senha</p>
            <input type="password" name="senha" placeholder="Digite sua senha" required id="senha">
            
            <a href="#">Esqueci minha senha</a>
            <button type="submit">Acessar</button>
        </form>
    </div>
<script src="script.js"></script>
</body>
</html>
